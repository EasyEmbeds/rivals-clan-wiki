<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Roblox Auto-Report Generator</title>
<style>
  body { font-family: 'Segoe UI', sans-serif; background: #1e1e1e; color: white; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
  .box { background: #2d2d2d; padding: 25px; border-radius: 12px; width: 380px; text-align: center; box-shadow: 0 5px 15px rgba(0,0,0,0.5); }
  input { width: 90%; padding: 12px; margin: 15px 0; background: #3d3d3d; border: 1px solid #555; color: white; border-radius: 6px; font-size: 14px; }
  button { width: 95%; padding: 12px; background: #e74c3c; color: white; border: none; border-radius: 6px; font-size: 16px; cursor: pointer; margin-top: 10px; }
  button:hover { background: #c0392b; }
  .log { margin-top: 15px; height: 200px; overflow-y: auto; background: #1a1a1a; padding: 10px; text-align: left; font-size: 12px; border-radius: 6px; font-family: monospace; }
  .status { color: #00b894; }
  .error { color: #e74c3c; }
</style>
</head>
<body>

<div class="box">
  <h2 style="margin-top:0;">Auto-Report Generator</h2>
  <p style="font-size:13px; color:#aaa;">Paste Profile URL below.</p>
  <input type="text" id="urlInput" placeholder="https://www.roblox.com/users/7681144231/profile">
  <button onclick="startAutoReport()">🚀 Start Auto-Submit (5 Tabs)</button>
  <div class="log" id="logArea"></div>
</div>

<script>
async function startAutoReport() {
    const input = document.getElementById('urlInput').value.trim();
    const log = document.getElementById('logArea');
    log.innerHTML = '';

    if (!input) return alert("Paste a URL first!");

    // 1. Extract ID
    const idMatch = input.match(/users\/(\d+)/);
    if (!idMatch) return alert("Invalid URL! Need /users/ID/profile");
    
    const userId = idMatch[1];
    const profileUrl = `https://www.roblox.com/users/${userId}/profile`;

    log.innerHTML += `<div class="status">[+] Opening 5 tabs for ID: ${userId}...</div>`;

    // 2. Open 5 Tabs
    for (let i = 1; i <= 5; i++) {
        const tab = window.open(profileUrl, '_blank');
        
        // Wait a bit for the page to load
        await new Promise(r => setTimeout(r, 1000 + (i * 200)));

        log.innerHTML += `<div class="status">[+] Tab ${i}: Waiting for '...' button...</div>`;
        
        // 3. Click the "..." (More) Button inside the tab
        try {
            await clickInTab(tab, `button[data-tooltip-id="user-profile-menu-button"]`, 2000);
            log.innerHTML += `<div class="status">[+] Tab ${i}: Menu Opened.</div>`;
            
            // Wait for menu to appear
            await new Promise(r => setTimeout(r, 500));

            // 4. Click "Report" inside the dropdown
            // Note: Roblox changes class names often. This is the most common one.
            await clickInTab(tab, `div[data-tooltip-id="user-profile-menu-button"] > div[role="menuitem"][aria-label*="Report"]`, 1500);
            
            log.innerHTML += `<div class="status">[+] Tab ${i}: Report Menu Clicked.</div>`;

            // 5. Try to Auto-Submit if it's a simple report (like Hacking)
            // If it opens a modal with a dropdown, this might fail, but we try anyway.
            await new Promise(r => setTimeout(r, 1000));
            
            // Look for the "Submit" button in the report modal
            const submitBtn = await findInTab(tab, `button[type="submit"], div[role="dialog"] button`);
            if (submitBtn) {
                clickInTab(tab, submitBtn.selector, 500);
                log.innerHTML += `<div class="status">[+] Tab ${i}: Auto-Submitted!</div>`;
            } else {
                log.innerHTML += `<div class="error">[-] Tab ${i}: Modal opened. You may need to click 'Submit' manually.</div>`;
            }

        } catch (e) {
            log.innerHTML += `<div class="error">[-] Tab ${i}: Failed to find button. Check tab.</div>`;
        }
    }
    log.innerHTML += `<div style="color:#74b9ff;">[✓] All 5 tabs processed!</div>`;
}

// Helper: Click inside a specific window/tab
function clickInTab(win, selector, delay) {
    return new Promise((resolve, reject) => {
        setTimeout(() => {
            try {
                // We need to access the document in the other tab. 
                // Note: Due to CORS, this only works if the tabs are same-origin (which Roblox is).
                const doc = win.document;
                const btn = doc.querySelector(selector);
                if (btn) {
                    btn.click();
                    resolve(true);
                } else {
                    reject("Element not found");
                }
            } catch (e) {
                reject(e);
            }
        }, delay || 0);
    });
}

// Helper: Find element in tab and return selector + element for clicking
function findInTab(win, selector) {
    return new Promise((resolve, reject) => {
        setTimeout(() => {
            try {
                const doc = win.document;
                const btn = doc.querySelector(selector);
                if (btn) {
                    resolve({ element: btn, selector: selector });
                } else {
                    reject("Not found");
                }
            } catch (e) {
                reject(e);
            }
        }, 1000);
    });
}
</script>

</body>
</html>
