<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Roblox Hacker Reporter</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #1e1e1e;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background-color: #2d2d2d;
            padding: 2rem;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            width: 400px;
            text-align: center;
        }
        h2 {
            margin-bottom: 1rem;
            color: #00b894;
        }
        input {
            width: 80%;
            padding: 10px;
            margin: 10px 0;
            border: 1px solid #444;
            background-color: #3d3d3d;
            color: white;
            border-radius: 5px;
        }
        button {
            padding: 10px 20px;
            background-color: #0984e3;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
        }
        button:hover {
            background-color: #74b9ff;
        }
        .log {
            margin-top: 20px;
            text-align: left;
            max-height: 200px;
            overflow-y: auto;
            background-color: #1a1a1a;
            padding: 10px;
            border-radius: 5px;
            font-family: monospace;
            font-size: 14px;
        }
        .log div {
            margin: 2px 0;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Roblox Hacker Reporter</h2>
    <p>Enter a Roblox Profile URL to generate reports.</p>
    
    <input type="text" id="profileUrl" placeholder="https://www.roblox.com/users/12345678/Profile">
    <button onclick="generateReports()">Generate Reports</button>

    <div class="log" id="reportLog"></div>
</div>

<script>
    function generateReports() {
        const urlInput = document.getElementById('profileUrl').value;
        const logDiv = document.getElementById('reportLog');
        logDiv.innerHTML = ''; // Clear previous logs

        if (!urlInput) {
            alert("Please enter a URL");
            return;
        }

        try {
            // Extract user ID from URL
            // Supports: roblox.com/users/ID/Name or roblox.com/user/Name
            let userId = "";
            const urlParts = urlInput.split('/');
            
            // Check if it's a numeric ID
            if (!isNaN(urlParts[urlParts.length - 2])) {
                userId = urlParts[urlParts.length - 2];
            } else {
                // Fallback: assume last part is username, but for reporting we usually need ID or direct link
                alert("Could not auto-extract numeric User ID. Ensure URL format is correct.");
                return;
            }

            // Simulate "creating accounts" by generating multiple report entries
            const reportCount = 5; // You can change this
            for (let i = 1; i <= reportCount; i++) {
                const reportLink = `https://www.roblox.com/my/reports?targetId=${userId}&type=HACKING`;
                
                // Create a log entry
                const logEntry = document.createElement('div');
                logEntry.innerHTML = `<span style="color:#00b894;">[+] Report #${i} Generated for ID: ${userId}</span>`;
                logDiv.appendChild(logEntry);

                // Open the report link in a new tab (simulating manual submission)
                // You can remove this line if you only want to generate links
                window.open(reportLink, '_blank');
            }

            const finalLog = document.createElement('div');
            finalLog.innerHTML = `<span style="color:#0984e3;">[✓] ${reportCount} reports generated. Check your new tabs!</span>`;
            logDiv.appendChild(finalLog);

        } catch (error) {
            logDiv.innerHTML = `<span style="color:#ff7675;">[-] Error: ${error.message}</span>`;
        }
    }
</script>

</body>
</html>
