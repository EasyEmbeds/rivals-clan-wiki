<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Roblox Hacker Reporter (Fixed)</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #1e1e1e;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background-color: #2d2d2d;
            padding: 2rem;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            width: 400px;
            text-align: center;
        }
        h2 { margin-bottom: 1rem; color: #00b894; }
        input {
            width: 80%; padding: 10px; margin: 10px 0;
            border: 1px solid #444; background-color: #3d3d3d;
            color: white; border-radius: 5px;
        }
        button {
            padding: 10px 20px; background-color: #0984e3; color: white;
            border: none; border-radius: 5px; cursor: pointer; font-size: 16px;
        }
        button:hover { background-color: #74b9ff; }
        .log {
            margin-top: 20px; text-align: left; max-height: 200px;
            overflow-y: auto; background-color: #1a1a1a; padding: 10px;
            border-radius: 5px; font-family: monospace; font-size: 14px;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Roblox Hacker Reporter</h2>
    <p>Paste Profile URL below.</p>
    
    <!-- Input field -->
    <input type="text" id="profileUrl" placeholder="https://www.roblox.com/users/12345678/Name">
    <button onclick="generateReports()">Generate & Open Reports</button>

    <div class="log" id="reportLog"></div>
</div>

<script>
    function generateReports() {
        const urlInput = document.getElementById('profileUrl').value;
        const logDiv = document.getElementById('reportLog');
        logDiv.innerHTML = ''; 

        if (!urlInput) { alert("Please enter a URL"); return; }

        try {
            // 1. Extract User ID
            let userId = "";
            const urlParts = urlInput.split('/');
            
            // Try to find the numeric ID in the URL path
            for (let part of urlParts) {
                if (!isNaN(part) && part.length > 5) { // Roblox IDs are usually long numbers
                    userId = part;
                    break;
                }
            }

            if (!userId) {
                alert("Could not find numeric User ID. Ensure URL is correct.");
                return;
            }

            // 2. Define Report Count
            const reportCount = 5; 
            let successCount = 0;

            // 3. Loop and Open Tabs
            for (let i = 1; i <= reportCount; i++) {
                // Roblox Public Report URL Format
                // Note: This links directly to the "Hacking" category pre-selected
                const reportUrl = `https://www.roblox.com/my/reports?targetId=${userId}&type=HACKING`;
                
                // Log it
                const logEntry = document.createElement('div');
                logEntry.innerHTML = `<span style="color:#00b894;">[+] Report #${i} | ID: ${userId}</span>`;
                logDiv.appendChild(logEntry);

                // Open Tab (with small delay to prevent popup blockers)
                setTimeout(() => {
                    const newTab = window.open(reportUrl, '_blank');
                    if (newTab && !newTab.closed) {
                        successCount++;
                    }
                }, i * 200); // 200ms delay between each open
            }

            setTimeout(() => {
                const finalLog = document.createElement('div');
                finalLog.innerHTML = `<span style="color:#0984e3;">[✓] Done. Check your tabs! (Allow popups if blocked)</span>`;
                logDiv.appendChild(finalLog);
            }, reportCount * 200 + 100);

        } catch (error) {
            logDiv.innerHTML = `<span style="color:#ff7675;">[-] Error: ${error.message}</span>`;
        }
    }
</script>

</body>
</html>
